name: BatxRinth Release Builder

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-release:
    name: Prepare release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$(jq -r .version apps/app-frontend/package.json)"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Create release if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --title "BatxRinth $TAG" \
              --notes "BatxRinth $TAG for Windows, macOS and Linux. macOS builds are not notarized: on first launch, right-click BatxRinth.app and choose Open."
          fi

  build:
    name: Build (${{ matrix.name }})
    needs: prepare-release
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            rust-targets: x86_64-pc-windows-msvc
            tauri-args: --bundles nsis
          - name: macOS
            os: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            tauri-args: --target universal-apple-darwin --bundles dmg
          - name: Linux
            os: ubuntu-22.04
            rust-targets: x86_64-unknown-linux-gnu
            tauri-args: --bundles appimage,deb,rpm
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev rpm

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - name: Install pnpm dependencies
        run: pnpm install

      - name: Build BatxRinth
        run: pnpm --filter=@batxrinth/app exec tauri build ${{ matrix.tauri-args }}

      - name: Upload installers to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p dist-release
          # Stable asset names keep the website's releases/latest/download links working
          copy() {
            local name=$1; shift
            [ $# -ge 1 ] || { echo "No bundle found for $name"; exit 1; }
            cp "$1" "dist-release/$name"
          }
          case "${{ runner.os }}" in
            Windows) copy BatxRinth_x64-setup.exe target/release/bundle/nsis/*.exe ;;
            macOS) copy BatxRinth_universal.dmg target/universal-apple-darwin/release/bundle/dmg/*.dmg ;;
            Linux)
              copy BatxRinth_amd64.AppImage target/release/bundle/appimage/*.AppImage
              copy BatxRinth_amd64.deb target/release/bundle/deb/*.deb
              copy BatxRinth_x86_64.rpm target/release/bundle/rpm/*.rpm
              ;;
          esac
          ls -la dist-release
          gh release upload "$TAG" dist-release/* --clobber
