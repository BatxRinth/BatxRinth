name: BatxRinth Release Builder

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'public_site/**'
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-release:
    name: Prepare release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$(jq -r .version apps/app-frontend/package.json)"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Create release if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --title "BatxRinth $TAG" \
              --notes "BatxRinth $TAG for Windows, macOS and Linux. macOS builds are not notarized: on first launch, right-click BatxRinth.app and choose Open."
          fi

  build:
    name: Build (${{ matrix.name }})
    needs: prepare-release
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            rust-targets: x86_64-pc-windows-msvc
            tauri-args: --bundles nsis
          - name: macOS
            os: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            tauri-args: --target universal-apple-darwin --bundles app,dmg
          - name: Linux
            os: ubuntu-22.04
            rust-targets: x86_64-unknown-linux-gnu
            tauri-args: --bundles appimage,deb,rpm
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev rpm

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      # Install targets on the toolchain pinned by rust-toolchain.toml, which is the one cargo uses
      - name: Setup Rust toolchain
        shell: bash
        run: |
          rustup toolchain install
          rustup target add $(echo "${{ matrix.rust-targets }}" | tr ',' ' ')

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - name: Install pnpm dependencies
        run: pnpm install

      - name: Build BatxRinth
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: |
          # Signed one-click updates are built only when the signing key secret is set
          config=""
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then config="--config tauri-release.conf.json"; fi
          pnpm --filter=@batxrinth/app exec tauri build $config ${{ matrix.tauri-args }}

      - name: Upload installers to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p dist-release
          # Stable asset names keep the website's releases/latest/download links working
          copy() {
            local name=$1; shift
            [ $# -ge 1 ] || { echo "No bundle found for $name"; exit 1; }
            cp "$1" "dist-release/$name"
          }
          # Updater files only exist in signed builds
          copy_if_built() { [ $# -ge 2 ] && cp "$2" "dist-release/$1" || true; }
          case "${{ runner.os }}" in
            Windows)
              copy BatxRinth_x64-setup.exe target/release/bundle/nsis/*.exe
              copy_if_built BatxRinth_x64-setup.exe.sig target/release/bundle/nsis/*.exe.sig
              ;;
            macOS)
              copy BatxRinth_universal.dmg target/universal-apple-darwin/release/bundle/dmg/*.dmg
              copy_if_built BatxRinth_universal.app.tar.gz target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
              copy_if_built BatxRinth_universal.app.tar.gz.sig target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
              ;;
            Linux)
              copy BatxRinth_amd64.AppImage target/release/bundle/appimage/*.AppImage
              copy BatxRinth_amd64.deb target/release/bundle/deb/*.deb
              copy BatxRinth_x86_64.rpm target/release/bundle/rpm/*.rpm
              copy_if_built BatxRinth_amd64.AppImage.sig target/release/bundle/appimage/*.AppImage.sig
              ;;
          esac
          ls -la dist-release
          gh release upload "$TAG" dist-release/* --clobber

  publish-update-manifest:
    name: Publish update manifest
    needs: [prepare-release, build]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Write latest.json from the uploaded signatures
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir sigs && cd sigs
          gh release download "$TAG" -R "$REPO" -p '*.sig' || true
          if ! ls *.sig >/dev/null 2>&1; then
            echo "No updater signatures on $TAG (TAURI_SIGNING_PRIVATE_KEY not set), skipping"
            exit 0
          fi
          base="https://github.com/$REPO/releases/download/$TAG"
          platforms='{}'
          add() {
            [ -f "$2.sig" ] || return 0
            platforms=$(jq --arg p "$1" --arg s "$(cat "$2.sig")" --arg u "$base/$2" '. + {($p): {signature: $s, url: $u}}' <<<"$platforms")
          }
          add windows-x86_64 BatxRinth_x64-setup.exe
          add darwin-aarch64 BatxRinth_universal.app.tar.gz
          add darwin-x86_64 BatxRinth_universal.app.tar.gz
          add linux-x86_64 BatxRinth_amd64.AppImage
          jq -n --arg v "${TAG#v}" --arg d "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --argjson p "$platforms"             '{version: $v, notes: "See the release notes on GitHub.", pub_date: $d, platforms: $p}' > latest.json
          cat latest.json
          gh release upload "$TAG" latest.json -R "$REPO" --clobber
