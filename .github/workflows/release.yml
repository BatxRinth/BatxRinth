name: BatxRinth Release Builder

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows Release (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/app
            packages/app-lib

      - name: Install pnpm dependencies
        run: pnpm install

      - name: Build BatxRinth Windows Application
        run: pnpm turbo run build --filter=@batxrinth/app

      - name: Rename & Upload Windows Installer (.exe)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ([string]::IsNullOrEmpty($tag)) { $tag = "v1.0.0" }
          $exePath = Get-ChildItem -Path "apps/app/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if ($exePath) {
            $destName = "BatxRinth_x64-setup.exe"
            Copy-Item $exePath.FullName -Destination $destName
            Write-Host "Found installer: $($exePath.FullName)"
            gh release upload $tag $destName --clobber
          } else {
            Write-Host "No EXE found in nsis bundle"
          }
